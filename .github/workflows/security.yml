name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC

permissions:
  contents: read

jobs:
  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: scan every commit, not just the diff
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  pip-audit:
    name: Python dependency audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      # No --ignore-vuln overrides yet. If an advisory is demonstrably not
      # applicable (dev-only dep, wrong install path, no fixed version),
      # add `--ignore-vuln <GHSA-XXXX-XXXX-XXXX>` here with a comment
      # naming the advisory and why it cannot affect Kairos.
      - uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: -r backend/requirements.txt

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
    steps:
      - uses: actions/checkout@v4
      # Python is analyzed without installing dependencies (CodeQL extracts
      # what it needs from source); JS/TS needs no build for Next.js analysis.
      - uses: github/codeql-action/init@v3
        with:
          languages: python, javascript-typescript
      - uses: github/codeql-action/autobuild@v3
        continue-on-error: true # JS autobuild may fail on missing NEXT_* args; analysis still runs
      - uses: github/codeql-action/analyze@v3
