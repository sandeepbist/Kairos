name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only needs to read the repo.
permissions:
  contents: read

# One CI run per ref at a time; PRs cancel superseded in-progress runs.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairos_user
          POSTGRES_PASSWORD: kairos_password
          POSTGRES_DB: kairos_db
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos_user -d kairos_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5435"
      TEMPORAL_HOST: localhost:7234
    steps:
      # Temporal runs as a step, not a service container: Actions services
      # cannot pass arguments to the image, and this image's entrypoint
      # needs "server start-dev" args (the earlier --entrypoint string
      # override made the container exit 127 before any health check).
      - name: Start Temporal dev server
        run: |
          docker run -d --name temporal-ci -p 7234:7234 \
            temporalio/temporal:1.8.2 \
            server start-dev --ip 0.0.0.0 --port 7234 --db-filename /tmp/temporal.db
          for i in $(seq 1 30); do
            if nc -z localhost 7234; then
              echo "Temporal ready"
              exit 0
            fi
            sleep 1
          done
          echo "Temporal failed to start"
          docker logs temporal-ci
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        # The lockfile is what ships in the image — test exactly those pins.
        run: pip install -r requirements.lock
      - name: Syntax hygiene (no JS-style comments in Python)
        # Python has no line-start `//` — any match is a typo that
        # py_compile may still accept inside expressions, so grep it.
        run: |
          if grep -rn --include='*.py' '^\s*//' backend/app backend/alembic backend/tests; then
            echo "::error::JS-style // comment found in Python source"
            exit 1
          fi
      - name: README test count matches suite
        # The README names the collected test count twice (the **N tests**
        # claim and the tests-N badge); fail if a new test lands without
        # updating both (keeps the docs claims honest).
        working-directory: backend
        run: |
          python - <<'EOF'
          import re, subprocess
          out = subprocess.run(
              ["python", "-m", "pytest", "tests/", "--collect-only",
               "-q", "-p", "no:cacheprovider"],
              capture_output=True, text=True,
          ).stdout
          n = int(re.search(r"(\d+) tests collected", out).group(1))
          readme = open("../README.md").read()
          problems = []
          m = re.search(r"\*\*(\d+) tests\*\* run against", readme)
          if not m or int(m.group(1)) != n:
              problems.append(f"claim says {m.group(1) if m else '?'}")
          b = re.search(r"tests-(\d+)%20passing", readme)
          if not b or int(b.group(1)) != n:
              problems.append(f"badge says {b.group(1) if b else '?'}")
          assert not problems, (
              f"README test count stale (suite collects {n}): " + "; ".join(problems)
          )
          print(f"test count consistent: {n}")
          EOF
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run battle test suite
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      - name: Extraction eval gate (deterministic baseline)
        working-directory: backend
        run: PYTHONPATH=. python -m evals.run --threshold 0.9

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build

  # Image smoke: a broken Dockerfile currently merges and only fails in
  # publish.yml on main/tags. Build both images on PRs (no push).
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: backend/Dockerfile
          push: false
      - name: Build frontend image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: frontend/Dockerfile
          push: false

  # Browser end-to-end suite (Playwright) against live Postgres + Temporal.
  # scripts/e2e-stack.sh boots worker + API + frontend on top of the services
  # below, runs `npx playwright test`, and tears everything down again.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairos_user
          POSTGRES_PASSWORD: kairos_password
          POSTGRES_DB: kairos_db
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos_user -d kairos_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5435"
      TEMPORAL_HOST: localhost:7234
    steps:
      # Same pattern as the backend job: Actions service containers cannot
      # pass args, so Temporal runs as a docker-run step with a readiness probe.
      - name: Start Temporal dev server
        run: |
          docker run -d --name temporal-ci -p 7234:7234 \
            temporalio/temporal:1.8.2 \
            server start-dev --ip 0.0.0.0 --port 7234 --db-filename /tmp/temporal.db
          for i in $(seq 1 30); do
            if nc -z localhost 7234; then
              echo "Temporal ready"
              exit 0
            fi
            sleep 1
          done
          echo "Temporal failed to start"
          docker logs temporal-ci
          exit 1
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install backend dependencies
        working-directory: backend
        run: pip install -r requirements.lock
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci
      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install chromium --with-deps
      - name: Run e2e stack
        run: bash scripts/e2e-stack.sh
