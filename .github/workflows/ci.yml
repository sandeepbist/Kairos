name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: kairos_user
          POSTGRES_PASSWORD: kairos_password
          POSTGRES_DB: kairos_db
        ports: ["5435:5432"]
        options: >-
          --health-cmd "pg_isready -U kairos_user -d kairos_db"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      temporal:
        image: temporalio/temporal:1.8.2
        ports: ["7234:7234"]
        options: >-
          --entrypoint "temporal server start-dev --ip 0.0.0.0 --port 7234 --db-filename /tmp/temporal.db"
          --health-cmd "nc -z localhost 7234"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5435"
      TEMPORAL_HOST: localhost:7234
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements.txt
      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run battle test suite
        working-directory: backend
        run: python -m pytest tests/ -v --tb=short

      - name: Extraction eval gate (deterministic baseline)
        working-directory: backend
        run: PYTHONPATH=. python -m evals.run --threshold 0.9

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Typecheck
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
