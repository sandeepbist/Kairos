# Pull-based Kairos stack — deploys prebuilt images from GHCR instead of
# building locally. Mirror of docker-compose.prod.yml with two changes:
#
#   1. api/worker/migrate/frontend use ghcr.io/sandeepbist/kairos-backend
#      and kairos-frontend at KAIROS_VERSION (release channel) instead of
#      building from source.
#   2. NEXT_PUBLIC_* URLs are baked into the frontend image at build
#      time (Next.js inlines them into the bundle). The published images
#      are built with empty defaults, so they ship without custom public
#      URLs; operators who need a custom Temporal UI or API docs URL
#      must build the frontend image locally (docker-compose.prod.yml
#      accepts them as build args).
#
# Channels:
#   KAIROS_VERSION=edge            every push to main (default)
#   KAIROS_VERSION=stable          latest v* tag
#   KAIROS_VERSION=v0.1.0          a specific release
#
# Requires .env with: POSTGRES_PASSWORD, API_KEY, ENCRYPTION_KEY (fresh
# Fernet key), and optionally connector/LLM keys. API and worker stay on
# the internal network; only the frontend is published.
#
#   KAIROS_VERSION=stable docker compose -f docker-compose.ghcr.yml \
#     --env-file .env up -d

name: kairos-ghcr

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kairos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-kairos_db}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [internal]
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kairos_user} -d ${POSTGRES_DB:-kairos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal:
    image: temporalio/temporal:1.8.2
    # dev-mode server persists to SQLite in /data; the image runs as the
    # non-root 'temporal' user, so the volume must be chowned first.
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--port", "7234", "--db-filename", "/data/temporal.db"]
    volumes:
      - temporaldata:/data
    networks: [internal]
    restart: unless-stopped
    depends_on:
      temporal-volume-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "7234"]
      interval: 10s
      timeout: 5s
      retries: 5

  temporal-volume-init:
    image: temporalio/temporal:1.8.2
    # Image defaults to USER temporal; chown needs root for first-run
    # volume ownership, then the server runs unprivileged.
    user: "0:0"
    entrypoint: ["/bin/sh", "-c", "chown -R temporal:temporal /data"]
    volumes:
      - temporaldata:/data
    networks: [internal]
    restart: "no"

  migrate:
    image: ghcr.io/sandeepbist/kairos-backend:${KAIROS_VERSION:-edge}
    command: ["python", "-m", "alembic", "upgrade", "head"]
    working_dir: /app/backend
    environment: &backend_env
      APP_ENV: production
      DEBUG: "false"
      API_KEY: ${API_KEY:?API_KEY is required}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?ENCRYPTION_KEY (44-char Fernet key) is required}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kairos_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-kairos_db}
      TEMPORAL_HOST: temporal:7234
      TEMPORAL_TASK_QUEUE: kairos-batch-queue
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      SANDBOX_MODE: ${SANDBOX_MODE:-false}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      DEFAULT_MODEL_NAME: ${DEFAULT_MODEL_NAME:-gemini-2.5-flash}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
    networks: [internal]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/sandeepbist/kairos-backend:${KAIROS_VERSION:-edge}
    environment: *backend_env
    networks: [internal]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  worker:
    image: ghcr.io/sandeepbist/kairos-backend:${KAIROS_VERSION:-edge}
    command: ["python", "-m", "app.temporal.worker"]
    working_dir: /app/backend
    environment:
      <<: *backend_env
      KAIROS_DB_APP_NAME: kairos-worker
      ENCRYPTION_KEY_PREVIOUS: ${ENCRYPTION_KEY_PREVIOUS:-}
    networks: [internal]
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      temporal:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

  frontend:
    image: ghcr.io/sandeepbist/kairos-frontend:${KAIROS_VERSION:-edge}
    # NEXT_PUBLIC_* are inlined at image build time (see header comment);
    # the server-side proxy vars below are runtime.
    environment:
      BACKEND_INTERNAL_URL: http://api:8000
      KAIROS_API_KEY: ${API_KEY:?API_KEY is required}
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    networks: [internal]
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  temporaldata:
